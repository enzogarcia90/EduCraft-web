<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex,nofollow">
		<meta name="theme-color" content="#15986f">
		<link rel="icon" type="image/png" sizes="32x32" href="../assets/educraft-icon-32.png">
		<link rel="apple-touch-icon" sizes="180x180" href="../assets/educraft-icon-180.png">
		<link rel="manifest" href="../site.webmanifest">
		<meta property="og:image" content="https://enzogarcia90.github.io/EduCraft-web/assets/educraft-icon-512.png">
		<meta name="twitter:image" content="https://enzogarcia90.github.io/EduCraft-web/assets/educraft-icon-512.png">
		<title>Administracion | EduCraft</title>
		<link rel="stylesheet" href="../styles.css">
		<link rel="stylesheet" href="dashboard.css">
	</head>
	<body class="portal-app" data-dashboard-page="administracion">
		<header class="portal-header">
			<a class="portal-brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><img src="../assets/educraft-icon-192.png" alt=""></span><span><strong>EduCraft</strong><small>Administracion</small></span></a>
			<div class="portal-session"><span id="sessionLabel">Validando sesion</span><button id="logoutButton" class="portal-ghost" type="button">Salir</button></div>
		</header>
		<main class="portal-layout">
			<aside class="portal-sidebar">
				<p class="eyebrow">Empresa</p>
				<h1 class="portal-title">Direccion global</h1>
				<p>Vista para propietario y equipo directivo de EduCraft. No depende de una institucion concreta.</p>
				<div id="identityPanel" class="identity-list"></div>
			</aside>
			<section class="portal-main">
				<section id="metricsGrid" class="portal-metrics"></section>
				<section class="portal-grid charts-grid">
					<article><h2>Usuarios por rol</h2><div id="roleChart" class="chart-box"></div></article>
					<article><h2>Centros activos</h2><div id="institutionChart" class="chart-box"></div></article>
					<article><h2>Licencias</h2><div id="licenseChart" class="chart-box"></div></article>
				</section>
				<section class="portal-grid two">
					<article><h2>Centros y licencias</h2><div id="licenseRack" class="signal-list"></div></article>
					<article><h2>Operacion</h2><div id="operationsRack" class="signal-list"></div></article>
				</section>
			</section>
		</main>
		<script src="../cliente/educraft-config.js"></script>
		<script src="dashboard.js"></script>
	</body>
</html>
