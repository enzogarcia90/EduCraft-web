<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="Play minecraft 1.8 in your browser" />
		<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.8, 1.8.8" />
		<title>EaglercraftX 1.8 WASM-GC</title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="EaglercraftX 1.8 WASM-GC" />
		<meta property="og:description" content="Play minecraft 1.8 in your browser" />
		<meta property="og:image" content="educraft-client-preview.png" />
		<meta name="twitter:image" content="educraft-client-preview.png" />
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<script type="text/javascript" src="educraft-config.js"></script>
		<script type="text/javascript" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
		<style>
			#educraft_turnstile_panel { position: fixed; z-index: 10000; left: 50%; bottom: 14px; transform: translateX(-50%); box-sizing: border-box; min-width: 330px; padding: 10px 13px; border: 2px solid #555; border-radius: 8px; background: rgba(20,20,20,.96); color: #eee; font: 14px Arial,sans-serif; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.55); }
			#educraft_turnstile_panel strong { display: block; margin-bottom: 7px; }
			#educraft_turnstile { min-height: 65px; }
			#educraft_turnstile_status { display: block; margin-top: 5px; color: #ddd; }
			#educraft_turnstile_panel.is-ready { border-color: #35a86b; }
			#educraft_turnstile_panel.is-ready #educraft_turnstile_status { color: #7ee2a7; }
			@media (max-width: 420px) { #educraft_turnstile_panel { min-width: 0; width: calc(100% - 20px); } }
		</style>
		<script type="text/javascript">
			(function () {
				"use strict";
				var token = "";
				var widgetId = null;
				var attempts = 0;
				function status(message, ready) {
					var panel = document.getElementById("educraft_turnstile_panel");
					var node = document.getElementById("educraft_turnstile_status");
					if (node) node.textContent = message;
					if (panel) panel.classList.toggle("is-ready", !!ready);
				}
				function render() {
					if (widgetId !== null) return;
					if (!window.turnstile || !document.getElementById("educraft_turnstile")) {
						if (++attempts < 60) window.setTimeout(render, 200);
						else status("No se pudo cargar la verificacion. Recarga la pagina.", false);
						return;
					}
					var sitekey = window.EDUCRAFT_TURNSTILE_SITE_KEY || "";
					if (!sitekey) { status("La verificacion no esta configurada.", false); return; }
					widgetId = window.turnstile.render("#educraft_turnstile", {
						sitekey: sitekey,
						action: "login",
						theme: "dark",
						callback: function (value) { token = value || ""; status("Verificacion completada. Ya puedes iniciar sesion.", true); },
						"expired-callback": function () { token = ""; status("La verificacion ha caducado; completa la nueva comprobacion.", false); },
						"error-callback": function () { token = ""; status("Cloudflare no pudo verificarte. Recarga la pagina.", false); }
					});
				}
				window.EDUCRAFT_getTurnstileToken = function () { return token; };
				window.EDUCRAFT_resetTurnstile = function () {
					token = "";
					var panel = document.getElementById("educraft_turnstile_panel");
					if (panel) panel.style.display = "block";
					status("Preparando una nueva verificacion...", false);
					if (window.turnstile && widgetId !== null) window.turnstile.reset(widgetId);
				};
				window.EDUCRAFT_hideTurnstile = function () {
					var panel = document.getElementById("educraft_turnstile_panel");
					if (panel) panel.style.display = "none";
				};
				window.addEventListener("load", render);
			}());
		</script>
		<script type="text/javascript" src="bootstrap.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {

					// %%%%%%%%% launch options %%%%%%%%%%%%

					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epw?v=" + Date.now(),
						worldsDB: "worlds",
						servers: [
							/* example: { addr: "ws://localhost:8081/", name: "Local test server" } */
						],
						relays: [
							{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
							{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
							{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
						]
					};

					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

					var q = window.location.search;
					if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
						q = new window.URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}

					main();

				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;">
		<div id="game_frame" style="width:100%;height:100%;"></div>
		<div id="educraft_turnstile_panel" role="region" aria-label="Verificacion humana">
			<strong>Verificacion de seguridad</strong>
			<div id="educraft_turnstile"></div>
			<small id="educraft_turnstile_status" role="status">Preparando comprobacion de Cloudflare...</small>
		</div>
	</body>
</html>
