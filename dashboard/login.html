		<meta property="og:image:width" content="512">

		<meta name="twitter:image" content="https://enzogarcia90.github.io/EduCraft-web/assets/educraft-icon-512.png">
		<link rel="alternate" type="text/plain" href="https://enzogarcia90.github.io/EduCraft-web/llms.txt" title="EduCraft llms.txt">

		<title>Login | EduCraft</title>
		<link rel="stylesheet" href="../styles.css">
		<link rel="stylesheet" href="dashboard.css">
	</head>
	<body class="portal-auth" data-dashboard-page="login">
		<main class="auth-layout login-layout">
			<section class="auth-visual login-visual">
				<a class="portal-brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><img src="../assets/educraft-icon-192.png" alt=""></span><span><strong>EduCraft</strong><small>Portal privado</small></span></a>
				<div>
					<p class="eyebrow">Acceso privado</p>
					<h1 class="auth-title">EduCraft</h1>
					<p>Inicia sesion para continuar.</p>
				</div>
				<div class="login-visual-rack" aria-hidden="true">
					<span></span>
					<span></span>
					<span></span>
				</div>
			</section>
			<section class="auth-card login-card">
				<p class="eyebrow">Login</p>
				<h2>Credenciales EduCraft</h2>
				<form id="loginForm" class="portal-form">
					<label><span>Correo electronico</span><input id="emailInput" type="email" autocomplete="username" inputmode="email" spellcheck="false" placeholder="nombre@centro.es" required></label>
					<label><span>Contraseña</span><span class="password-input-row"><input id="passwordInput" type="password" autocomplete="current-password" placeholder="Introduce tu contraseña" required><button id="passwordVisibilityButton" type="button" aria-controls="passwordInput" aria-pressed="false">Mostrar</button></span></label>
					<div class="turnstile-panel"><strong>Verificacion de seguridad</strong><div id="loginTurnstile"><span class="turnstile-loading">Preparando comprobacion...</span></div><small id="loginTurnstileStatus" role="status">Se completara automaticamente.</small></div>
					<button class="button primary" type="submit">Entrar</button>
				</form>
				<p id="authMessage" class="portal-message" role="status"></p>
				<div class="auth-links"><a href="registro.html">Crear cuenta de centro</a><a href="../index.html">Volver a la web</a></div>
			</section>
		</main>
		<script src="../cliente/educraft-config.js"></script>
		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
		<script src="dashboard.js?v=20260831-loginturnstile1"></script>
	</body>
</html>
