name: EduCraft health mirror

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/educraft-health-mirror.yml"

permissions:
  contents: write

concurrency:
  group: educraft-health-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar y validar EduCraft
        env:
          HEALTH_URL: https://educraftes.duckdns.org/health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --retry 2 --retry-all-errors \
            "$HEALTH_URL" > health-source.json

          jq -e '
            .status == "ok" and
            (.version | type == "string" and length > 0) and
            (.uptime_seconds | type == "number") and
            (.services | type == "object" and length > 0)
          ' health-source.json >/dev/null

          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg checked_at "$checked_at" '
            . + {
              mirrored_at: $checked_at,
              mirror_source: "github-actions",
              source_url: "https://educraftes.duckdns.org/health"
            }
          ' health-source.json > health.json

      - name: Publicar ultimo estado verificable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${repository}/git"
          content="$(base64 -w0 health.json)"

          blob_sha="$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/blobs" \
            -d "$(jq -n --arg content "$content" '{content:$content,encoding:"base64"}')" \
            | jq -r .sha)"

          tree_sha="$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/trees" \
            -d "$(jq -n --arg sha "$blob_sha" '{tree:[{path:"health.json",mode:"100644",type:"blob",sha:$sha}]}')" \
            | jq -r .sha)"

          commit_sha="$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/commits" \
            -d "$(jq -n --arg message "Estado EduCraft $(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg tree "$tree_sha" '{message:$message,tree:$tree}')" \
            | jq -r .sha)"

          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repository}/git/refs" \
            -d "$(jq -n --arg ref "refs/heads/health-status" --arg sha "$commit_sha" '{ref:$ref,sha:$sha}')" \
            >/dev/null 2>/tmp/create-ref-error || \
          curl --fail --silent --show-error \
            -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repository}/git/refs/heads/health-status" \
            -d "$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:true}')" \
            >/dev/null
