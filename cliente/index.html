<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="Cliente web EduCraft en desarrollo para aulas educativas compatibles con Minecraft." />
		<meta name="keywords" content="educraft, minecraft educativo, edtech, aulas minecraft, stem" />
		<link rel="alternate" type="text/plain" href="https://enzogarcia90.github.io/EduCraft-web/llms.txt" title="EduCraft llms.txt">
		<link rel="alternate" type="text/plain" href="https://enzogarcia90.github.io/EduCraft-web/ai.txt" title="EduCraft AI summary">
		<link rel="alternate" type="application/json" href="https://enzogarcia90.github.io/EduCraft-web/ai.json" title="EduCraft AI metadata">
		<link rel="sitemap" type="application/xml" href="https://enzogarcia90.github.io/EduCraft-web/sitemap.xml">
		<title>EduCraft Cliente | En desarrollo</title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="EduCraft Cliente" />
		<meta property="og:description" content="Cliente web EduCraft en desarrollo. Puede contener bugs durante pilotos y demos." />
		<meta property="og:image" content="educraft-client-preview.png" />
		<meta name="twitter:image" content="educraft-client-preview.png" />
		<link rel="icon" type="image/png" sizes="256x256" href="favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="../assets/educraft-icon-180.png" />
		<link rel="manifest" href="../site.webmanifest" />
		<script type="text/javascript" src="educraft-config.js"></script>
		<script type="text/javascript" src="bootstrap.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					
					// %%%%%%%%% launch options %%%%%%%%%%%%
					
					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epw",
						worldsDB: "worlds",
						servers: [
						],
						relays: [
							{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
							{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
							{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
						]
					};
					
					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
					
					var q = window.location.search;
					if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
						q = new window.URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}
					
					main();
					
				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame"></body>
</html>
