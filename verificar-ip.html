<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificar IP | EduCraft</title><link rel="icon" href="assets/educraft-icon-32.png"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f8f5;font:16px Arial,sans-serif;color:#16352b}.card{width:min(420px,calc(100% - 40px);padding:42px 28px;text-align:center;background:#fff;border:1px solid #d8e8df;border-radius:24px;box-shadow:0 18px 48px #17332b18}.logo{width:68px;height:68px;margin:auto;border-radius:20px;background:#15986f url('assets/educraft-icon-192.png') center/52px no-repeat}.spinner{width:32px;height:32px;border:4px solid #d6eee4;border-top-color:#15986f;border-radius:50%;margin:28px auto 16px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.ok{color:#087653;font-weight:bold}</style></head><body><main class="card"><div class="logo" aria-hidden="true"></div><div id="spinner" class="spinner"></div><h1 id="title">Verificando tu IP…</h1><p id="message">Estamos confirmando que reconoces este inicio de sesión.</p></main><script src="cliente/educraft-config.js"></script><script>const token=new URLSearchParams(location.hash.slice(1)).get('token'),base=(window.EDUCRAFT_API_BASE_URL||'').replace(/\/$/,'');const title=document.querySelector('#title'),message=document.querySelector('#message');(async()=>{try{if(!token)throw new Error();const r=await fetch(base+'/login/ip-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok)throw new Error();document.querySelector('#spinner').remove();title.textContent='IP verificada';title.className='ok';message.textContent='Por favor, cierra esta página.'}catch(_){document.querySelector('#spinner').remove();title.textContent='Enlace no válido';message.textContent='Este enlace ya se usó o ha caducado. Solicita otro inicio de sesión.'}})();</script></body></html>
