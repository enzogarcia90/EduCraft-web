<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex,nofollow">
		<meta name="theme-color" content="#15986f">
		<title>Administracion | EduCraft</title>
		<link rel="stylesheet" href="../styles.css">
		<link rel="stylesheet" href="dashboard.css">
	</head>
	<body class="portal-app" data-dashboard-page="administracion">
		<header class="portal-header">
			<a class="portal-brand" href="../index.html"><span class="brand-mark">E</span><span><strong>EduCraft</strong><small>Administracion</small></span></a>
			<div class="portal-session"><span id="sessionLabel">Validando sesion</span><button id="logoutButton" class="portal-ghost" type="button">Salir</button></div>
		</header>
		<main class="portal-layout">
			<aside class="portal-sidebar">
				<p class="eyebrow">Empresa</p>
				<h1 class="portal-title">Direccion global</h1>
				<p>Vista para propietario y equipo directivo de EduCraft. No depende de una institucion concreta.</p>
				<div id="identityPanel" class="identity-list"></div>
			</aside>
			<section class="portal-main">
				<section id="metricsGrid" class="portal-metrics"></section>
				<section class="portal-grid three">
					<article><h2>Centros y licencias</h2><div id="licenseRack" class="signal-list"></div></article>
					<article><h2>Salud operativa</h2><div id="healthRack" class="signal-list"></div></article>
					<article><h2>Actividad reciente</h2><div id="activityRack" class="signal-list"></div></article>
				</section>
				<section class="portal-grid two">
					<article><h2>Operacion</h2><div id="operationsRack" class="signal-list"></div></article>
					<article><h2>Capacidades activas</h2><div id="capabilitiesRack" class="signal-list"></div></article>
				</section>
			</section>
		</main>
		<script src="../cliente/educraft-config.js"></script>
		<script src="dashboard.js"></script>
	</body>
</html>
