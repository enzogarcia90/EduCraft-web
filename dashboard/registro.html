<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<meta name="application-name" content="EduCraft">
		<meta name="keywords" content="EduCraft, EdTech España, educación STEM, aulas virtuales, gamificación educativa, panel docente, instalaciones virtuales educativas, aprendizaje basado en juego, química visual, SaaS educativo">
		<meta name="description" content="Registro privado EduCraft para centros educativos.">
		<meta name="robots" content="noindex,nofollow">
		<meta name="theme-color" content="#15986f">
		<link rel="icon" type="image/png" sizes="32x32" href="../assets/educraft-icon-32.png">
		<link rel="apple-touch-icon" sizes="180x180" href="../assets/educraft-icon-180.png">
		<link rel="manifest" href="../site.webmanifest">
		<meta property="og:image" content="https://enzogarcia90.github.io/EduCraft-web/assets/educraft-icon-512.png">
		<meta property="og:image:width" content="512">
		<meta property="og:image:height" content="512">
		<meta property="og:image:alt" content="Logo de EduCraft">
		<meta name="twitter:image" content="https://enzogarcia90.github.io/EduCraft-web/assets/educraft-icon-512.png">
		<link rel="alternate" type="text/plain" href="https://enzogarcia90.github.io/EduCraft-web/llms.txt" title="EduCraft llms.txt">
		<link rel="alternate" type="text/plain" href="https://enzogarcia90.github.io/EduCraft-web/ai.txt" title="EduCraft AI summary">
		<link rel="alternate" type="application/json" href="https://enzogarcia90.github.io/EduCraft-web/ai.json" title="EduCraft AI metadata">
		<link rel="sitemap" type="application/xml" href="https://enzogarcia90.github.io/EduCraft-web/sitemap.xml">
		<title>Registro | EduCraft</title>
		<link rel="stylesheet" href="../styles.css">
		<link rel="stylesheet" href="dashboard.css">
	</head>
	<body class="portal-auth" data-dashboard-page="registro">
		<main class="auth-layout">
			<section class="auth-visual">
				<a class="portal-brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><img src="../assets/educraft-icon-192.png" alt=""></span><span><strong>EduCraft</strong><small>Alta de centro</small></span></a>
				<div>
					<p class="eyebrow">Registro</p>
					<h1 class="auth-title">Alta EduCraft</h1>
					<p>Completa los datos para solicitar acceso.</p>
				</div>
			</section>
			<section class="auth-card register-card">
				<p class="eyebrow">Nueva institucion</p>
				<h2>Datos de alta</h2>
				<div class="register-progress" aria-live="polite">
					<span id="registerStepText">Paso 1/5</span>
					<div><i id="registerProgressBar"></i></div>
				</div>
				<form id="registerForm" class="portal-form">
					<fieldset class="register-step is-active" data-register-step="0">
						<legend>Centro</legend>
						<label><span>Nombre publico del centro</span><input id="registerInstitution" type="text" autocomplete="organization" required></label>
						<label><span>Nombre legal completo</span><input id="registerLegalName" type="text" required></label>
						<label><span>Tipo de institucion</span><select id="registerInstitutionType" required><option value="">Seleccionar</option><option value="colegio">Colegio</option><option value="instituto">Instituto</option><option value="formacion_profesional">Formacion profesional</option><option value="universidad">Universidad</option><option value="academia">Academia</option><option value="otro">Otro centro educativo</option></select></label>
						<label><span>CIF/NIF o identificador fiscal</span><input id="registerTaxId" type="text" required></label>
						<label><span>Web oficial</span><input id="registerWebsite" type="url" placeholder="https://centro.edu" required></label>
						<label><span>Dominio educativo</span><input id="registerDomain" type="text" placeholder="centro.edu" required></label>
					</fieldset>
					<fieldset class="register-step" data-register-step="1">
						<legend>Ubicacion</legend>
						<label><span>Pais</span><input id="registerCountry" type="text" value="ES" required></label>
						<label><span>Provincia o region</span><input id="registerRegion" type="text" required></label>
						<label><span>Ciudad</span><input id="registerCity" type="text" required></label>
						<label><span>Codigo postal</span><input id="registerPostalCode" type="text" required></label>
						<label><span>Direccion completa</span><input id="registerAddress" type="text" autocomplete="street-address" required></label>
						<label><span>Zona horaria</span><input id="registerTimezone" type="text" value="Europe/Madrid" required></label>
					</fieldset>
					<fieldset class="register-step" data-register-step="2">
						<legend>Responsables</legend>
						<label><span>Nombre del responsable</span><input id="registerName" type="text" autocomplete="name" required></label>
						<label><span>Cargo del responsable</span><input id="registerContactTitle" type="text" placeholder="Direccion, TIC, coordinacion..." required></label>
						<label><span>Telefono del centro</span><input id="registerContactPhone" type="tel" autocomplete="tel" required></label>
						<label><span>Email institucional TIC</span><input id="registerEmail" type="email" autocomplete="username" required></label>
						<label><span>Email tecnico</span><input id="registerTechnicalEmail" type="email" required></label>
						<label><span>Responsable proteccion de datos</span><input id="registerDataProtectionName" type="text" required></label>
						<label><span>Email proteccion de datos</span><input id="registerDataProtectionEmail" type="email" required></label>
					</fieldset>
					<fieldset class="register-step" data-register-step="3">
						<legend>Uso educativo</legend>
						<label><span>Numero de alumnos</span><input id="registerStudentCount" type="number" min="1" step="1" required></label>
						<label><span>Numero de profesores</span><input id="registerTeacherCount" type="number" min="1" step="1" required></label>
						<label><span>Etapas o cursos</span><input id="registerGrades" type="text" placeholder="ESO, Bachillerato, FP..." required></label>
						<label><span>SIS o gestion academica</span><input id="registerSIS" type="text" placeholder="Alexia, Educamos, Google Classroom..." required></label>
						<label><span>SSO previsto</span><input id="registerSSO" type="text" placeholder="Google, Microsoft, LDAP, ninguno..." required></label>
					</fieldset>
					<fieldset class="register-step confirmations" data-register-step="4">
						<legend>Confirmaciones obligatorias</legend>
						<label><input id="registerAuthority" type="checkbox" required><span>Tengo autorizacion del centro para solicitar el alta.</span></label>
						<label><input id="registerDomainOwnership" type="checkbox" required><span>El centro controla el dominio y los emails indicados.</span></label>
						<label><input id="registerMinors" type="checkbox" required><span>El centro puede tratar datos de menores conforme a su politica educativa.</span></label>
						<label><input id="registerTerms" type="checkbox" required><span>Acepto las condiciones del servicio.</span></label>
						<label><input id="registerPrivacy" type="checkbox" required><span>Acepto la politica de privacidad.</span></label>
						<label><input id="registerDPA" type="checkbox" required><span>Acepto el acuerdo de tratamiento de datos.</span></label>
						<label class="password-row"><span>Contrasena</span><input id="registerPassword" type="password" autocomplete="new-password" minlength="10" required></label>
					</fieldset>
					<div class="register-nav">
						<button id="registerPrev" class="portal-ghost" type="button">Anterior</button>
						<button id="registerNext" class="button primary" type="button">Siguiente</button>
						<button id="registerSubmit" class="button primary" type="submit" hidden>Crear cuenta</button>
					</div>
				</form>
				<p id="registerMessage" class="portal-message" role="status"></p>
				<div class="auth-links"><a href="login.html">Ya tengo cuenta</a><a href="../index.html">Volver a la web</a></div>
			</section>
		</main>
		<script src="../cliente/educraft-config.js"></script>
		<script src="dashboard.js?v=20260812-viewer5"></script>
	</body>
</html>
